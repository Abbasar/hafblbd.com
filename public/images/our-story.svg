<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#E8F5E9" opacity="0.5" rx="10" ry="10" />
  
  <!-- Farm landscape -->
  <path d="M0 200 Q 100 180, 200 200 Q 300 220, 400 200 L 400 300 L 0 300 Z" fill="#2E7D32" opacity="0.7" />
  <path d="M0 220 Q 100 200, 200 220 Q 300 240, 400 220 L 400 300 L 0 300 Z" fill="#1B5E20" opacity="0.7" />
  
  <!-- Sun -->
  <circle cx="350" cy="80" r="40" fill="#FF9800" />
  <circle cx="350" cy="80" r="30" fill="#FFEB3B" />
  
  <!-- Rays -->
  <path d="M350 30 L350 10" stroke="#FFEB3B" stroke-width="3" />
  <path d="M350 150 L350 130" stroke="#FFEB3B" stroke-width="3" />
  <path d="M300 80 L280 80" stroke="#FFEB3B" stroke-width="3" />
  <path d="M420 80 L400 80" stroke="#FFEB3B" stroke-width="3" />
  <path d="M315 45 L300 30" stroke="#FFEB3B" stroke-width="3" />
  <path d="M385 115 L400 130" stroke="#FFEB3B" stroke-width="3" />
  <path d="M315 115 L300 130" stroke="#FFEB3B" stroke-width="3" />
  <path d="M385 45 L400 30" stroke="#FFEB3B" stroke-width="3" />
  
  <!-- Farmhouse -->
  <rect x="50" y="150" width="80" height="50" fill="#E65100" />
  <polygon points="40,150 90,100 140,150" fill="#5D4037" />
  <rect x="70" y="170" width="20" height="30" fill="#FFFFFF" />
  <rect x="100" y="160" width="15" height="15" fill="#FFFFFF" />
  
  <!-- Trees -->
  <rect x="180" y="170" width="10" height="30" fill="#5D4037" />
  <circle cx="185" cy="150" r="20" fill="#2E7D32" />
  
  <rect x="220" y="180" width="10" height="20" fill="#5D4037" />
  <circle cx="225" cy="165" r="15" fill="#2E7D32" />
  
  <rect x="250" y="175" width="10" height="25" fill="#5D4037" />
  <circle cx="255" cy="155" r="18" fill="#2E7D32" />
  
  <!-- Fruit trees -->
  <rect x="300" y="170" width="8" height="30" fill="#5D4037" />
  <circle cx="304" cy="150" r="20" fill="#2E7D32" />
  <circle cx="290" cy="145" r="5" fill="#FF9800" />
  <circle cx="310" cy="140" r="5" fill="#FF9800" />
  <circle cx="320" cy="155" r="5" fill="#FF9800" />
  
  <!-- Farmer -->
  <circle cx="150" cy="200" r="10" fill="#FFCC80" />
  <rect x="145" y="210" width="10" height="20" fill="#2E7D32" />
  <line x1="145" y1="215" x2="135" y2="225" stroke="#2E7D32" stroke-width="3" />
  <line x1="155" y1="215" x2="165" y2="225" stroke="#2E7D32" stroke-width="3" />
  <line x1="150" y1="230" x2="145" y2="250" stroke="#2E7D32" stroke-width="3" />
  <line x1="150" y1="230" x2="155" y2="250" stroke="#2E7D32" stroke-width="3" />
</svg>