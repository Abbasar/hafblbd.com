<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="instaGradient" cx="0.2" cy="1" r="1.2">
      <stop offset="0%" stop-color="#FFDC80" />
      <stop offset="10%" stop-color="#FCAF45" />
      <stop offset="50%" stop-color="#E1306C" />
      <stop offset="85%" stop-color="#833AB4" />
      <stop offset="100%" stop-color="#405DE6" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="url(#instaGradient)" />
  <!-- Camera outline -->
  <rect x="12" y="12" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="2" />
  <!-- Camera lens -->
  <circle cx="20" cy="20" r="4" fill="none" stroke="white" stroke-width="2" />
  <!-- Camera flash -->
  <circle cx="25" cy="15" r="1.5" fill="white" />
</svg>