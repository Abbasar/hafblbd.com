<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- Background -->
  <rect width="200" height="250" fill="#E8F5E9" />
  
  <!-- Suit -->
  <rect x="60" y="120" width="80" height="130" fill="#455A64" />
  
  <!-- Shirt -->
  <path d="M80 120 L80 180 L120 180 L120 120 Z" fill="#FFFFFF" />
  
  <!-- Tie -->
  <path d="M95 120 L105 120 L105 140 L100 150 L95 140 Z" fill="#D32F2F" />
  
  <!-- Head -->
  <circle cx="100" cy="80" r="40" fill="#FFCC80" />
  
  <!-- Hair -->
  <path d="M70 60 C70 40, 130 40, 130 60" fill="#5D4037" />
  <path d="M70 60 C70 80, 70 80, 70 90 C70 100, 80 100, 80 90" fill="#5D4037" />
  <path d="M130 60 C130 80, 130 80, 130 90 C130 100, 120 100, 120 90" fill="#5D4037" />
  
  <!-- Eyes -->
  <circle cx="85" cy="75" r="5" fill="#FFFFFF" />
  <circle cx="115" cy="75" r="5" fill="#FFFFFF" />
  <circle cx="85" cy="75" r="2" fill="#263238" />
  <circle cx="115" cy="75" r="2" fill="#263238" />
  
  <!-- Eyebrows -->
  <path d="M80 65 C85 60, 90 60, 95 65" fill="none" stroke="#5D4037" stroke-width="2" />
  <path d="M105 65 C110 60, 115 60, 120 65" fill="none" stroke="#5D4037" stroke-width="2" />
  
  <!-- Nose -->
  <path d="M100 75 L100 90 L105 90" fill="none" stroke="#FFCC80" stroke-width="2" />
  
  <!-- Mouth -->
  <path d="M90 100 C95 105, 105 105, 110 100" fill="none" stroke="#263238" stroke-width="2" />
  
  <!-- Glasses -->
  <rect x="75" y="70" width="20" height="10" rx="5" ry="5" fill="none" stroke="#263238" stroke-width="1" />
  <rect x="105" y="70" width="20" height="10" rx="5" ry="5" fill="none" stroke="#263238" stroke-width="1" />
  <path d="M95 75 L105 75" fill="none" stroke="#263238" stroke-width="1" />
</svg>