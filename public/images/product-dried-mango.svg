<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Package background -->
  <rect x="40" y="40" width="120" height="140" rx="10" fill="#FFECB3" />
  <!-- Package outline -->
  <rect x="40" y="40" width="120" height="140" rx="10" stroke="#E65100" stroke-width="2" fill="none" />
  <!-- Transparent window showing dried mango slices -->
  <rect x="50" y="60" width="100" height="80" rx="5" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <!-- Dried mango slices -->
  <path d="M60 80 C 70 75, 80 85, 90 80 C 100 75, 110 85, 120 80 C 130 75, 140 85, 140 90 C 140 100, 130 105, 120 100 C 110 95, 100 105, 90 100 C 80 95, 70 105, 60 100 Z" fill="#FFCC29" />
  <path d="M60 110 C 70 105, 80 115, 90 110 C 100 105, 110 115, 120 110 C 130 105, 140 115, 140 120 C 140 130, 130 135, 120 130 C 110 125, 100 135, 90 130 C 80 125, 70 135, 60 130 Z" fill="#FF9800" />
  <!-- Texture lines on mango slices -->
  <path d="M70 80 L 70 100" stroke="#E65100" stroke-width="0.5" />
  <path d="M90 80 L 90 100" stroke="#E65100" stroke-width="0.5" />
  <path d="M110 80 L 110 100" stroke="#E65100" stroke-width="0.5" />
  <path d="M130 80 L 130 100" stroke="#E65100" stroke-width="0.5" />
  <path d="M70 110 L 70 130" stroke="#E65100" stroke-width="0.5" />
  <path d="M90 110 L 90 130" stroke="#E65100" stroke-width="0.5" />
  <path d="M110 110 L 110 130" stroke="#E65100" stroke-width="0.5" />
  <path d="M130 110 L 130 130" stroke="#E65100" stroke-width="0.5" />
  <!-- Package label -->
  <rect x="60" y="150" width="80" height="20" rx="3" fill="#E65100" />
  <text x="100" y="165" font-family="Arial" font-size="10" fill="white" text-anchor="middle">DRIED MANGO</text>
</svg>