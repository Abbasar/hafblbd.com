<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Package background -->
  <rect x="40" y="40" width="120" height="140" rx="10" fill="#F5F5F5" />
  <!-- Package outline -->
  <rect x="40" y="40" width="120" height="140" rx="10" stroke="#424242" stroke-width="2" fill="none" />
  <!-- Transparent window showing dried fruits -->
  <rect x="50" y="60" width="100" height="80" rx="5" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1" />
  <!-- Dried fruits -->
  <ellipse cx="70" cy="80" rx="15" ry="10" fill="#E65100" /> <!-- Dried apricot -->
  <path d="M100 75 C 110 70, 120 75, 115 85 C 110 95, 100 90, 95 85 Z" fill="#5D4037" /> <!-- Dried fig -->
  <ellipse cx="80" cy="100" rx="10" ry="15" fill="#2E7D32" /> <!-- Dried kiwi -->
  <circle cx="110" cy="105" r="12" fill="#FF9800" /> <!-- Dried peach -->
  <ellipse cx="130" cy="85" rx="8" ry="12" fill="#8D6E63" /> <!-- Dried date -->
  <!-- Package label -->
  <rect x="60" y="150" width="80" height="20" rx="3" fill="#2E7D32" />
  <text x="100" y="165" font-family="Arial" font-size="12" fill="white" text-anchor="middle">DRIED FRUITS</text>
</svg>